A MP 1.376, que abriu a renegociação das dívidas do campo, perde a validade na quarta-feira (11) e ainda não virou lei.

Até 4 de novembro, R$ 19,8 bilhões tinham sido renegociados. Isso é menos de 20% dos R$ 100 bilhões projetados.

Por que o volume ficou baixo: exigência de laudo técnico, regras de garantias e de enquadramento, e a dificuldade de fechar a papelada.

O que fazer agora:
- O prazo para contratar nos bancos vai até 12/11.
- Há reunião de negociação marcada para terça-feira (10).
- Quem ainda não renegociou deve procurar o banco e o advogado de confiança hoje.

Salve este post e compartilhe com um produtor que precisa saber disso.
